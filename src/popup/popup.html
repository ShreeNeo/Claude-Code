<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neram</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="title">
        <span class="icon">⏱️</span>
        Neram
      </h1>
      <button id="pauseBtn" class="btn-icon" title="Pause/Resume tracking">
        <span id="pauseIcon">⏸️</span>
      </button>
    </header>

    <!-- Current Session -->
    <section class="current-session">
      <div class="session-info" id="currentSessionInfo">
        <div class="session-label">Current Session</div>
        <div class="session-domain" id="currentDomain">—</div>
        <div class="session-duration" id="currentDuration">0m 0s</div>
      </div>
    </section>

    <!-- Pomodoro Timer -->
    <section class="pomodoro-section" id="pomodoroSection" style="display: none;">
      <div class="pomodoro-header">
        <h2 class="section-title">🎯 Focus Timer</h2>
        <button id="togglePomodoroBtn" class="btn-icon-small" title="Expand/Collapse">
          <span>▼</span>
        </button>
      </div>
      <div class="pomodoro-content" id="pomodoroContent">
        <div class="pomodoro-display">
          <div class="pomodoro-type" id="popupPomodoroType">WORK SESSION</div>
          <div class="pomodoro-time-large" id="popupPomodoroTime">25:00</div>
          <div class="pomodoro-session-info" id="popupPomodoroSession">Session 1 of 4</div>
        </div>
        <div class="pomodoro-controls-popup">
          <button id="popupStartBtn" class="btn-pomodoro btn-pomodoro-start">
            <span>▶</span>
          </button>
          <button id="popupPauseBtn" class="btn-pomodoro btn-pomodoro-pause" style="display: none;">
            <span>⏸</span>
          </button>
          <button id="popupResetBtn" class="btn-pomodoro btn-pomodoro-reset">
            <span>↻</span>
          </button>
        </div>
        <div class="pomodoro-stats-popup">
          <div class="stat-mini">
            <span class="stat-mini-label">Today:</span>
            <span class="stat-mini-value" id="popupSessionsToday">0</span>
          </div>
          <div class="stat-mini">
            <span class="stat-mini-label">Time:</span>
            <span class="stat-mini-value" id="popupTimeToday">0m</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Today's Stats -->
    <section class="today-stats">
      <h2 class="section-title">Today</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Time</div>
          <div class="stat-value" id="todayTotal">0h 0m</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Sessions</div>
          <div class="stat-value" id="todaySessions">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Productivity</div>
          <div class="stat-value" id="todayProductivity">—</div>
        </div>
      </div>
    </section>

    <!-- Top Sites -->
    <section class="top-sites">
      <h2 class="section-title">Top Sites Today</h2>
      <div id="topSitesList" class="sites-list">
        <div class="loading">Loading...</div>
      </div>
    </section>

    <!-- Footer Actions -->
    <footer class="footer">
      <button id="dashboardBtn" class="btn btn-primary">
        Open Dashboard
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
