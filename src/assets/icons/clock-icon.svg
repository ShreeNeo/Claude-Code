<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Gradient Background Circle -->
  <defs>
    <linearGradient id="clockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#clockGradient)" opacity="1"/>

  <!-- Clock Face -->
  <circle cx="64" cy="64" r="52" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

  <!-- Hour Markers -->
  <g stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <!-- 12 o'clock -->
    <line x1="64" y1="18" x2="64" y2="26" />
    <!-- 3 o'clock -->
    <line x1="110" y1="64" x2="102" y2="64" />
    <!-- 6 o'clock -->
    <line x1="64" y1="110" x2="64" y2="102" />
    <!-- 9 o'clock -->
    <line x1="18" y1="64" x2="26" y2="64" />
  </g>

  <!-- Minute Markers -->
  <g stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="64" y1="20" x2="64" y2="24" transform="rotate(30 64 64)" />
    <line x1="64" y1="20" x2="64" y2="24" transform="rotate(60 64 64)" />
    <line x1="64" y1="20" x2="64" y2="24" transform="rotate(120 64 64)" />
    <line x1="64" y1="20" x2="64" y2="24" transform="rotate(150 64 64)" />
    <line x1="64" y1="20" x2="64" y2="24" transform="rotate(210 64 64)" />
    <line x1="64" y1="20" x2="64" y2="24" transform="rotate(240 64 64)" />
    <line x1="64" y1="20" x2="64" y2="24" transform="rotate(300 64 64)" />
    <line x1="64" y1="20" x2="64" y2="24" transform="rotate(330 64 64)" />
  </g>

  <!-- Hour Hand (pointing to 10) -->
  <line x1="64" y1="64" x2="64" y2="40"
        stroke="url(#handGradient)"
        stroke-width="5"
        stroke-linecap="round"
        transform="rotate(-60 64 64)"
        opacity="0.95">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Minute Hand (pointing to 2) -->
  <line x1="64" y1="64" x2="64" y2="28"
        stroke="url(#handGradient)"
        stroke-width="4"
        stroke-linecap="round"
        transform="rotate(60 64 64)"
        opacity="0.95">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Center Dot -->
  <circle cx="64" cy="64" r="5" fill="white" opacity="0.9">
    <animate attributeName="r" values="4;5;4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
